# version: '3.8'
# For the variables, create an '.env' file on the same level as this compose file
# In there, declare the variables with your desired values like:
# UCE_CONFIG_PATH=./../uceConfig.json
# JVM_ARGS=-Xmx8g
# ...

services:

  uce-web:
    container_name: uce-web
    image: uce-web:local-fast
    build:
      context: .
      dockerfile: ${UCE_WEB_DOCKERFILE:-./uce.portal/uce.web/Dockerfile}
    profiles:
      - local
      - remote
      - remotekc
      - remotedb
      - ssh
      - proxy
    env_file:
      - ${UCE_COMPOSE_ENV_FILE:-.env}
    environment:
      VIRTUAL_HOST: ${UCE_PUBLIC_HOST:-}
      VIRTUAL_PORT: ${UCE_PUBLISHED_PORT:-}
      UCE_STORAGE_BACKEND: ${UCE_STORAGE_BACKEND:-dua}
      UCE_DUA_STORE: ${UCE_DUA_STORE_CONTAINER_PATH:-/app/dua/uce-dua-store.bin}
      UCE_DUA_FLUSH_EVERY_MUTATIONS: ${UCE_DUA_FLUSH_EVERY_MUTATIONS:-1}
      # Compose-derived legacy runtime vars (deduplicated from .env host/port primitives).
      UCE_AUTH_PUBLIC_URL: ${KEYCLOAK_PUBLIC_SCHEME:-http}://${KEYCLOAK_PUBLIC_HOST:-}:${KEYCLOAK_PUBLISHED_PORT:-}
      UCE_AUTH_REDIRECT_URL: ${UCE_SCHEME:-http}://${KEYCLOAK_PUBLIC_HOST:-}:${UCE_PUBLISHED_PORT:-}/auth
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_INTERNAL_SCHEME:-http}://uce-keycloak-auth:${KEYCLOAK_INTERNAL_PORT:-8080}
      POSTGRESQL_HIBERNATE_CONNECTION_URL: jdbc:postgresql://${DB_HOST:-}:${DB_RUNTIME_PORT:-5432}/${DB_NAME:-}
      POSTGRESQL_HIBERNATE_CONNECTION_USERNAME: ${DB_USER:-}
      POSTGRESQL_HIBERNATE_CONNECTION_PASSWORD: ${DB_PASSWORD:-}
      SPARQL_HOST: ${SPARQL_HOST:-http://uce-fuseki-sparql:5430/}
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT:-biofid-search/sparql}
      SPARQL_MAX_ENRICHMENT: ${SPARQL_MAX_ENRICHMENT:-100}
      SPARQL_CONCURRENT_REQUESTS_MAX: ${SPARQL_CONCURRENT_REQUESTS_MAX:-64}
      RAG_WEBSERVER_BASE_URL: ${RAG_WEBSERVER_BASE_URL:-http://uce-rag-service:5678/}
      EMBEDDING_WEBSERVER_BASE_URL: ${EMBEDDING_WEBSERVER_BASE_URL:-http://uce-rag-service:5678/}
      UCE_DUAVIZ_HTTP_URL: ${UCE_DUAVIZ_HTTP_URL:-http://duas:17875}
    ports:
      - "${UCE_PUBLISHED_PORT:-}:${UCE_INTERNAL_PORT:-4567}"
    depends_on:
      uce-postgresql-db:
        condition: service_healthy
        required: false
      duas:
        condition: service_started
        required: false
      uce-fuseki-sparql:
        condition: service_started
        required: false
      uce-rag-service:
        condition: service_started
        required: false
    networks:
      - app_net
    volumes:
      - "${UCE_CONFIG_PATH:-./uce.portal/uce.common/src/main/resources/defaultUceConfig.json}:/app/config/uceConfig.json:ro"
      - "${UCE_DATABASE_SCRIPTS_HOST_PATH:-./database}:${DATABASE_SCRIPTS_LOCATION:-/app/database}"
      # External templates (host-mounted) so UI can be edited without rebuilding the image
      - "${UCE_TEMPLATES_HOST_PATH:-./uce.portal/resources/templates}:${TEMPLATES_LOCATION:-/app/uce.portal/resources/templates}"
      - "${UCE_DUA_STORE_HOST_DIR:-./.dev/storage/dua}:${UCE_DUA_STORE_CONTAINER_DIR:-/app/dua}:rw"
    command: [
      "java",
      "--add-opens=java.base/java.util=ALL-UNNAMED",
      "--add-opens=java.base/java.time=ALL-UNNAMED",
      "-jar",
      "./target/webportal-jar-with-dependencies.jar",
      "-cf",
      "/app/config/uceConfig.json"
    ]

  duas:
    container_name: duas
    image: ${DUA_SERVICE_IMAGE:-docker.texttechnologylab.org/duas:0.1.0-SNAPSHOT}
    build:
      context: ${DUA_SERVICE_BUILD_CONTEXT:-/home/stud_homes/s0424382/projects/ttlab/duui-alpha/DockerUnifiedUIMAInterface/duui-dua}
      dockerfile: ${DUA_SERVICE_DOCKERFILE:-Containerfile}
    profiles:
      - dua
    restart: unless-stopped
    ports:
      - "${DUA_SERVICE_HTTP_PORT:-17875}:17875"
      - "${DUA_SERVICE_WS_PORT:-17876}:17876"
    environment:
      DUA_SERVICE_BIND_HOST: ${DUA_SERVICE_BIND_HOST:-0.0.0.0}
      DUA_SERVICE_PUBLIC_HOST: ${DUA_SERVICE_PUBLIC_HOST:-127.0.0.1}
      DUA_STORE_PATH: ${DUA_SERVICE_STORE_CONTAINER_PATH:-/data/dua}
      DUA_PORT: "17875"
      SPARQL_HOST: ${SPARQL_HOST:-http://uce-fuseki-sparql:5430/}
      SPARQL_ENDPOINT: ${SPARQL_ENDPOINT:-biofid-search/sparql}
      RAG_WEBSERVER_BASE_URL: ${RAG_WEBSERVER_BASE_URL:-http://uce-rag-service:5678/}
      EMBEDDING_WEBSERVER_BASE_URL: ${EMBEDDING_WEBSERVER_BASE_URL:-http://uce-rag-service:5678/}
      DUA_RAG_MODEL: ${DUA_RAG_MODEL:-openai/gemma3:latest}
      DUA_RAG_MODEL_URL: ${DUA_RAG_MODEL_URL:-https://www.llm.texttechnologylab.org/api}
      DUA_RAG_API_KEY: ${DUA_RAG_API_KEY:-}
    volumes:
      - "${DUA_SERVICE_STORE_HOST_PATH:-/storage/projects/BIOfid/code/dterefe/artifacts/dua-heideltime}:${DUA_SERVICE_STORE_CONTAINER_PATH:-/data/dua}:rw"
      - "${DUA_SERVICE_SOURCE_HOST_PATH:-/storage/projects/BIOfid/code/dterefe/artifacts/development/2026_06_18_heideltime}:${DUA_SERVICE_SOURCE_CONTAINER_PATH:-/storage/projects/BIOfid/code/dterefe/artifacts/development/2026_06_18_heideltime}:ro"
      - "${UCE_CONFIG_PATH:-./.dev/storage/config/uceConfig.json}:/opt/dua/uceConfig.json:ro"
    command:
      - java
      - --enable-preview
      - --enable-native-access=ALL-UNNAMED
      - --add-opens
      - java.base/java.nio=ALL-UNNAMED
      - --add-exports
      - java.base/sun.nio.ch=ALL-UNNAMED
      - -cp
      - /opt/dua/lib/*
      - org.texttechnologylab.duui.dua.service.DUAServiceLauncher
      - ${DUA_SERVICE_STORE_CONTAINER_PATH:-/data/dua}
      - "17875"
    networks:
      - app_net

  dua-biofid-importer:
    container_name: dua-biofid-importer
    image: ${DUA_SERVICE_IMAGE:-docker.texttechnologylab.org/duas:0.1.0-SNAPSHOT}
    build:
      context: ${DUA_SERVICE_BUILD_CONTEXT:-/home/stud_homes/s0424382/projects/ttlab/duui-alpha/DockerUnifiedUIMAInterface/duui-dua}
      dockerfile: ${DUA_SERVICE_DOCKERFILE:-Containerfile}
    profiles:
      - dua-import
    restart: "no"
    environment:
      DUA_SOURCE_ROOT: ${DUA_SERVICE_SOURCE_CONTAINER_PATH:-/storage/projects/BIOfid/code/dterefe/artifacts/development/2026_06_18_heideltime}
      DUA_STORE_PATH: ${DUA_SERVICE_STORE_CONTAINER_PATH:-/data/dua}
      DUA_CORPUS_ID: ${DUA_CORPUS_ID:-biofid-2026-06-18-heideltime}
      DUA_IMPORT_LIMIT: ${DUA_IMPORT_LIMIT:-0}
      DUA_PIPELINE_THREADS: ${DUA_PIPELINE_THREADS:-8}
      DUA_BACKEND_SLOTS: ${DUA_BACKEND_SLOTS:-4}
      DUA_DOMAIN_POOL_SIZE: ${DUA_DOMAIN_POOL_SIZE:-4}
      DUA_SOURCE_PARALLELISM: ${DUA_SOURCE_PARALLELISM:-4}
      DUA_WRITEBACK_PARALLELISM: ${DUA_WRITEBACK_PARALLELISM:-4}
      DUA_IMPORT_DOMAIN_STRATEGY: ${DUA_IMPORT_DOMAIN_STRATEGY:-DOCUMENT}
      DUA_IMPORT_DOMAIN_GROUP_SIZE: ${DUA_IMPORT_DOMAIN_GROUP_SIZE:-1}
    volumes:
      - "${DUA_SERVICE_STORE_HOST_PATH:-/storage/projects/BIOfid/code/dterefe/artifacts/dua-heideltime}:${DUA_SERVICE_STORE_CONTAINER_PATH:-/data/dua}:rw"
      - "${DUA_SERVICE_SOURCE_HOST_PATH:-/storage/projects/BIOfid/code/dterefe/artifacts/development/2026_06_18_heideltime}:${DUA_SERVICE_SOURCE_CONTAINER_PATH:-/storage/projects/BIOfid/code/dterefe/artifacts/development/2026_06_18_heideltime}:ro"
    command:
      - java
      - --enable-preview
      - --enable-native-access=ALL-UNNAMED
      - --add-opens
      - java.base/java.nio=ALL-UNNAMED
      - --add-exports
      - java.base/sun.nio.ch=ALL-UNNAMED
      - -cp
      - /opt/dua/lib/*
      - org.texttechnologylab.duui.dua.uce.BIOfidPipelineImporter
    networks:
      - app_net

  uce-dua-web:
    container_name: uce-dua-web
    image: ${UCE_DUA_WEB_DEV_IMAGE:-docker.io/library/node:20-alpine}
    working_dir: /app
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4579"
      UCE_DUA_WS_URL: ${UCE_DUA_WEB_WS_URL:-ws://duas:17876/ws/duaviz}
      VITE_DUA_WS_URL: ${UCE_DUA_WEB_WS_URL:-ws://duas:17876/ws/duaviz}
    ports:
      - "${UCE_DUA_WEB_PORT:-4579}:4579"
    volumes:
      - ./uce.portal/uce-dua-web:/app:rw
      - uce_dua_web_node_modules:/app/node_modules
    command:
      - sh
      - -lc
      - npm install && npm run dev -- --host 0.0.0.0 --port 4579
    depends_on:
      duas:
        condition: service_started
        required: false
    networks:
      - app_net

  uce-postgresql-db:
    container_name: uce-postgresql-db
    image: ${POSTGRES_IMAGE:-docker.texttechnologylab.org/uce/uce-postgresql:latest}
    pull_policy: always
    profiles:
      - local
      - remotekc
      - db
    env_file:
      - ${UCE_COMPOSE_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${DB_NAME:-}
      POSTGRES_USER: ${DB_USER:-}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "${DB_PORT:-5432}:${DB_INTERNAL_PORT:-5432}"
    volumes:
      - ${POSTGRES_DATA_HOST_PATH:-./.dev/storage/postgres}:/var/lib/postgresql/data
      #- ./../backups/2025-07-03_BIOfid_Nova-Data/db-data:/var/lib/postgresql/data
      - ${POSTGRESQL_CONFIG:-./database/postgresql.conf}:/etc/postgresql.conf
    command: -c config_file=/etc/postgresql.conf
    networks:
      - app_net
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-}"]
        interval: 5s
        timeout: 5s
        start_period: 10s
        retries: 20

  uce-keycloak-auth:
    container_name: uce-keycloak-auth
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2.5}
    pull_policy: always
    profiles:
      - local
      - remotedb
      - ssh
      - proxy
    env_file:
      - ${UCE_COMPOSE_ENV_FILE:-.env}
    ports:
      - "${KEYCLOAK_PUBLISHED_PORT:-}:${KEYCLOAK_INTERNAL_PORT:-8080}"
    volumes:
      - ${KC_REALM_IMPORT_PATH:-./auth/uce-realm.json}:/opt/keycloak/data/import/uce-realm.json
      # Persist Keycloak data (incl. embedded DB) outside the container
      # - ${KEYCLOAK_DATA_HOST_PATH:-./data/keycloak}:/opt/keycloak/data
    command:
      - ${KEYCLOAK_START_CMD:-start}
      - --features=${KEYCLOAK_FEATURES:-scripts}
      - --import-realm
      - --import-path=${KEYCLOAK_IMPORT_PATH:-/opt/keycloak/data/import/uce-realm.json}
    environment:
      VIRTUAL_HOST: ${KEYCLOAK_PUBLIC_HOST:-}
      VIRTUAL_PORT: ${KEYCLOAK_PUBLISHED_PORT:-}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PW:-}
      KC_HOSTNAME_STRICT_BACKCHANNEL: ${KC_HOSTNAME_STRICT_BACKCHANNEL:-true}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH:-/}
      KC_HTTP_ENABLED: ${KC_HTTP_ENABLED:-true}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
      KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Keycloak 26 exposes health endpoints on the management interface (port 9000).
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app_net

  uce-keycloak-config:
    image: ${KEYCLOAK_CONFIG_IMAGE:-docker.texttechnologylab.org/uce-core-feedback-keycloak-config:latest}
    pull_policy: always
    container_name: uce-keycloak-config
    profiles:
      - local
      - remotedb
      - ssh
      - proxy
    env_file:
      - ${UCE_COMPOSE_ENV_FILE:-.env}
    depends_on:
      uce-keycloak-auth:
        condition: service_healthy
    environment:
      KC_BASE_URL: ${KEYCLOAK_INTERNAL_SCHEME:-http}://uce-keycloak-auth:${KEYCLOAK_INTERNAL_PORT:-8080}
      KC_MGMT_URL: ${KEYCLOAK_INTERNAL_SCHEME:-http}://uce-keycloak-auth:${KEYCLOAK_MGMT_PORT:-9003}
      KC_REALM: ${KC_REALM:-uce}
      KC_CLIENT_ID: ${KC_CLIENT_ID:-uce-web}
      KC_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-}
      KC_ADMIN_PW: ${KC_ADMIN_PW:-}
      UCE_PUBLIC_URL: ${UCE_SCHEME:-http}://${UCE_PUBLIC_HOST:-localhost}:${UCE_PUBLISHED_PORT:-}
      KEYCLOAK_CREDENTIALS_SECRET: ${KEYCLOAK_CREDENTIALS_SECRET:-}
      KC_SSL_REQUIRED: ${KC_SSL_REQUIRED:-none}
      KC_SSO_SESSION_IDLE_TIMEOUT: ${KC_SSO_SESSION_IDLE_TIMEOUT:-}
    networks:
      - app_net

  uce-minio-storage:
    image: minio/minio
    container_name: minio
    profiles:
      - minio
    env_file:
      - ${UCE_COMPOSE_ENV_FILE:-.env}
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    volumes:
      - ${MINIO_STORAGE_DATA:-./data/minio}:/data
    command: server /data --console-address ":9001"
    networks:
      - app_net

  uce-fuseki-sparql:
    container_name: uce-fuseki-sparql
    image: docker.texttechnologylab.org/uce/uce-fuseki-sparql:0.0.1
    user: "0:0"
    profiles:
      - fuseki
    ports:
      - "8030:5430"
    volumes:
      - ${TDB2_DATA:-/storage/projects/bagci/BioFID/database/data/sparql/biofid-search}:/fuseki/databases/${TDB2_ENDPOINT:-biofid-search}
    environment:
      - JAVA_OPTIONS=${JAVA_OPTIONS:-}
    command: --update --tdb2 --port 5430 --loc /fuseki/databases/${TDB2_ENDPOINT:-biofid-search} /${TDB2_ENDPOINT:-biofid-search}
    networks:
      - app_net

  uce-rag-service:
    container_name: uce-rag-service
    image: ${RAG_SERVICE_IMAGE:-docker.texttechnologylab.org/uce-rag-service-baumartz:0.0.5}
    profiles:
      - rag
    ports:
      - "${RAG_SERVICE_PORT:-5678}:5678"
    depends_on:
      uce-postgresql-db:
        condition: service_started
        required: false
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
  minio-data:
  uce_dua_web_node_modules:
